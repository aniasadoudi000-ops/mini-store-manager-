{% extends "base.html" %}
{% block content %}
<h1>{% if product_id %}Modifier{% else %}Nouveau{% endif %} produit</h1>
<form method="post">
    <div class="mb-3">
        <label class="form-label">Nom</label>
        <input type="text" name="name" class="form-control" value="{{ product['name'] if product else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control">{{ product['description'] if product else '' }}</textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Prix (€)</label>
        <input type="number" step="0.01" min="0" name="price" class="form-control" value="{{ product['price'] if product else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Stock</label>
        <input type="number" min="0" name="stock" class="form-control" value="{{ product['stock'] if product else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Catégorie</label>
        <select name="category_id" class="form-select" required>
            <option value="">-- Choisir --</option>
            {% for cat in categories %}
            <option value="{{ cat['id'] }}" {% if product and product['category_id']|string == cat['id']|string %}selected{% endif %}>{{ cat['name'] }}</option>
            {% endfor %}
        </select>
    </div>
    <button class="btn btn-primary">Enregistrer</button>
    <a href="{{ url_for('products') }}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
