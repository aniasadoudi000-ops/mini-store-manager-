{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Produits</h1>
    <a href="{{ url_for('product_new') }}" class="btn btn-primary">+ Nouveau produit</a>
</div>

<form method="get" class="row g-2 mb-3">
    <div class="col-md-4">
        <input type="text" name="q" class="form-control" placeholder="Rechercher par nom" value="{{ search }}">
    </div>
    <div class="col-md-3">
        <select name="category" class="form-select">
            <option value="">Toutes les catégories</option>
            {% for cat in categories %}
            <option value="{{ cat['id'] }}" {% if category_id|string == cat['id']|string %}selected{% endif %}>{{ cat['name'] }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-3">
        <select name="sort" class="form-select">
            <option value="name_asc" {% if sort == 'name_asc' %}selected{% endif %}>Nom A-Z</option>
            <option value="name_desc" {% if sort == 'name_desc' %}selected{% endif %}>Nom Z-A</option>
            <option value="price_asc" {% if sort == 'price_asc' %}selected{% endif %}>Prix croissant</option>
            <option value="price_desc" {% if sort == 'price_desc' %}selected{% endif %}>Prix décroissant</option>
        </select>
    </div>
    <div class="col-md-2">
        <button class="btn btn-secondary w-100">Filtrer</button>
    </div>
</form>

<table class="table table-striped">
    <thead>
        <tr><th>Nom</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th>Actions</th></tr>
    </thead>
    <tbody>
        {% for p in products %}
        <tr>
            <td>{{ p['name'] }}</td>
            <td>{{ p['category_name'] }}</td>
            <td>{{ "%.2f"|format(p['price']) }} €</td>
            <td>
                {{ p['stock'] }}
                {% if p['stock'] < 5 %}<span class="badge bg-danger">Stock bas</span>{% endif %}
            </td>
            <td>
                <a href="{{ url_for('product_edit', product_id=p['id']) }}" class="btn btn-sm btn-outline-primary">Éditer</a>
                <form method="post" action="{{ url_for('product_delete', product_id=p['id']) }}" class="d-inline" onsubmit="return confirm('Supprimer ce produit ?');">
                    <button class="btn btn-sm btn-outline-danger">Supprimer</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
