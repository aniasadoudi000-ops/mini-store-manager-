{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Commandes</h1>
    <a href="{{ url_for('order_new') }}" class="btn btn-primary">+ Nouvelle commande</a>
</div>
<table class="table table-striped">
    <thead>
        <tr><th>ID</th><th>Client</th><th>Date</th><th>Statut</th><th>Montant</th><th></th></tr>
    </thead>
    <tbody>
        {% for o in orders %}
        <tr>
            <td>{{ o['id'] }}</td>
            <td>{{ o['customer_name'] }}</td>
            <td>{{ o['order_date'] }}</td>
            <td>{{ o['status'] }}</td>
            <td>{{ "%.2f"|format(o['total_amount']) }} €</td>
            <td><a href="{{ url_for('order_detail', order_id=o['id']) }}" class="btn btn-sm btn-outline-primary">Voir</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
